services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: motabari3-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: hemocelldb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - motabari3-network

  # Backend API Server
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: motabari3-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      CONNECTION_STRING: mongodb://admin:password123@mongodb:27017/hemocelldb?authSource=admin
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      RESEND_API_KEY: your-resend-api-key
      FRONTEND_URL: localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      - mongodb
    volumes:
      - ./server:/app
      - /app/node_modules
    networks:
      - motabari3-network

  # Frontend React App
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: motabari3-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - motabari3-network

networks:
  motabari3-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local